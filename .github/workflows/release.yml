name: Release Skills

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare tag release
        id: release
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          python .github/scripts/extract_latest_release_notes.py CHANGELOG.md release-notes.md --tag "${RELEASE_TAG}" --plugin-json .codex-plugin/plugin.json

      - name: Commit release metadata
        if: steps.release.outputs.changelog_changed == 'true' || steps.release.outputs.plugin_changed == 'true'
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .codex-plugin/plugin.json
          git diff --cached --quiet || git commit -m "chore: sync release metadata ${RELEASE_TAG} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Build release archive
        run: |
          rm -rf skills-package plugin-package Gei-skills.zip Gei-codex-plugin.zip
          mkdir -p skills-package/Gei
          cp -R skills/. skills-package/Gei/
          cd skills-package
          zip -r ../Gei-skills.zip .
          cd ..
          mkdir -p plugin-package/gei
          cp -R .codex-plugin assets skills docs hooks README.md CHANGELOG.md plugin-package/gei/
          cd plugin-package
          zip -r ../Gei-codex-plugin.zip gei

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          fi
          if [ -s release-notes.md ]; then
            gh release create "${RELEASE_TAG}" Gei-skills.zip Gei-codex-plugin.zip \
              --generate-notes \
              --notes "$(cat release-notes.md)"
          else
            gh release create "${RELEASE_TAG}" Gei-skills.zip Gei-codex-plugin.zip \
              --generate-notes
          fi
